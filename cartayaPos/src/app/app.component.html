<ion-app>
  <!-- Language Switcher -->
  <div style="padding: 10px; background-color: #f0f0f0; text-align: center;">
    <span style="margin-right: 10px; font-weight: bold;">{{ 'LANGUAGE' | translate }}:</span>
    <button (click)="switchLanguage('en')" [class.active]="currentLanguage === 'en'" style="margin-right: 5px;">
      {{ 'ENGLISH' | translate }}
    </button>
    <button (click)="switchLanguage('es')" [class.active]="currentLanguage === 'es'">
      {{ 'SPANISH' | translate }}
    </button>
  </div>

  <!-- Main Router Outlet -->
  <ion-router-outlet></ion-router-outlet>
  
  <!-- Order Summary Component (side panel on desktop, bottom sheet on mobile) -->
  <app-order-summary></app-order-summary>
</ion-app>
