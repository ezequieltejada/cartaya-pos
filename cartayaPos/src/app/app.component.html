<ion-app>
  <!-- Side Menu -->
  <ion-menu contentId="main-content" menuId="main-menu">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button fill="clear" (click)="closeMenu()" [attr.aria-label]="'COMMON.BUTTONS.CANCEL' | translate">
            <ion-icon name="close"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-title>{{ 'MENU.TITLE' | translate }}</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/products" routerLinkActive="selected">
            <ion-icon slot="start" name="grid-outline"></ion-icon>
            <ion-label>{{ 'MENU.PRODUCTS' | translate }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/order-history" routerLinkActive="selected">
            <ion-icon slot="start" name="receipt-outline"></ion-icon>
            <ion-label>{{ 'MENU.ORDER_HISTORY' | translate }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/order-queue" routerLinkActive="selected">
            <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
            <ion-label>{{ 'MENU.ORDER_QUEUE' | translate }}</ion-label>
            @if (queueService.totalQueueSize() > 0) {
              <ion-badge>{{ queueService.pendingCount() }}</ion-badge>
            }
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/settings" routerLinkActive="selected">
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>{{ 'MENU.SETTINGS' | translate }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>

    <!-- Footer: appearance (left) and logout (right), two small columns pinned to the bottom -->
    <ion-footer class="menu-footer">
      <div class="menu-footer__grid">
        <!-- Stays open so the change is visible right away -->
        <label class="menu-footer__cell menu-footer__theme">
          <span class="type-body-sm menu-footer__text">{{ 'MENU.DARK_MODE' | translate }}</span>
          <ion-toggle
            class="theme-toggle"
            [checked]="theme.isDark()"
            [attr.aria-label]="'MENU.DARK_MODE' | translate"
            (ionChange)="theme.setMode($event.detail.checked ? 'dark' : 'light')"
          ></ion-toggle>
        </label>

        <ion-menu-toggle auto-hide="false">
          <button type="button" class="menu-footer__cell menu-footer__logout" (click)="logout()">
            <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
            <span class="type-body-sm menu-footer__text">{{ 'MENU.LOGOUT' | translate }}</span>
          </button>
        </ion-menu-toggle>
      </div>
    </ion-footer>
  </ion-menu>

  <!-- Main Content -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
