<ion-app>
  <!-- Side Menu -->
  <ion-menu contentId="main-content" menuId="main-menu">
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ 'MENU.TITLE' | translate }}</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/products" routerLinkActive="selected">
            <ion-icon slot="start" name="grid-outline"></ion-icon>
            <ion-label>{{ 'MENU.PRODUCTS' | translate }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/order-history" routerLinkActive="selected">
            <ion-icon slot="start" name="receipt-outline"></ion-icon>
            <ion-label>{{ 'MENU.ORDER_HISTORY' | translate }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/order-queue" routerLinkActive="selected">
            <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
            <ion-label>{{ 'MENU.ORDER_QUEUE' | translate }}</ion-label>
            @if (queueService.totalQueueSize() > 0) {
              <ion-badge>{{ queueService.pendingCount() }}</ion-badge>
            }
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/settings" routerLinkActive="selected">
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>{{ 'MENU.SETTINGS' | translate }}</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Language Section Divider -->
        <ion-item-divider></ion-item-divider>

        <!-- Language Section -->
        <app-language-switcher
          displayMode="menu"
          (languageChanged)="onLanguageChanged($event)">
        </app-language-switcher>

        <!-- Logout -->
        <ion-item-divider></ion-item-divider>
        <ion-menu-toggle auto-hide="false">
          <ion-item button (click)="logout()" class="logout-item">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>{{ 'MENU.LOGOUT' | translate }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Main Content -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
