<ion-app>
  <!-- Side Menu -->
  <ion-menu contentId="main-content" menuId="main-menu">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/products" routerLinkActive="selected">
            <ion-icon slot="start" name="grid-outline"></ion-icon>
            <ion-label>Products</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/settings" routerLinkActive="selected">
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>Settings</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle auto-hide="false">
          <ion-item button (click)="logout()" class="logout-item">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Main Content -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

  <!-- Language Switcher -->
  <div style="padding: 10px; background-color: #f0f0f0; text-align: center;">
    <span style="margin-right: 10px; font-weight: bold;">{{ 'LANGUAGE' | translate }}:</span>
    <button (click)="switchLanguage('en')" [class.active]="currentLanguage === 'en'" style="margin-right: 5px;">
      {{ 'ENGLISH' | translate }}
    </button>
    <button (click)="switchLanguage('es')" [class.active]="currentLanguage === 'es'">
      {{ 'SPANISH' | translate }}
    </button>
  </div>
</ion-app>
