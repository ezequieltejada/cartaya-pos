<ion-card (click)="onTap()">
  @if (imageUrl()) {
    <ion-img [src]="imageUrl()" loading="lazy" (ionError)="onImageError()"></ion-img>
  } @else {
    <div class="imageContainer">
      <ion-icon name="image-outline"></ion-icon>
    </div>
  }
  <ion-card-header>
    <ion-card-title>{{ product.name }}</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <p class="price" [class.unavailable]="!product.defaultPrice">
      {{ formattedPrice }}
    </p>
    <p class="description" *ngIf="hasDescription">
      {{ product.description }}
    </p>
    <p class="category" *ngIf="product.category">{{ product.category.name }}</p>
  </ion-card-content>
</ion-card>
