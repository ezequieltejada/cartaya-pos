<app-page-header [title]="selectedPos?.name || ('PRODUCT_GRID.TITLE' | translate)" id="product-catalog-content">
  <ion-searchbar 
    slot="secondary"
    [(ngModel)]="searchQuery"
    (ionInput)="onSearchInput($event)"
    [placeholder]="'PRODUCT_GRID.SEARCH_PLACEHOLDER' | translate"
    debounce="300"
    >
  </ion-searchbar>
</app-page-header>

<ion-content id="product-catalog-content">
  <!-- Category Filter -->
  <nav
    *ngIf="categoriesWithCount().length > 0"
    class="category-chips"
    [attr.aria-label]="'PRODUCT_GRID.CATEGORY_FILTER' | translate"
  >
    <button
      type="button"
      class="category-chip type-label"
      [class.category-chip--active]="selectedCategoryId === 'all'"
      [attr.aria-pressed]="selectedCategoryId === 'all'"
      (click)="selectCategory('all', $event)"
    >
      {{ 'PRODUCT_GRID.ALL_CATEGORIES' | translate }}
    </button>
    <button
      *ngFor="let category of categoriesWithCount()"
      type="button"
      class="category-chip type-label"
      [class.category-chip--active]="selectedCategoryId === category.id"
      [attr.aria-pressed]="selectedCategoryId === category.id"
      (click)="selectCategory(category.id, $event)"
    >
      {{ category.name }}<ng-container *ngIf="category.productCount === 0"> · {{ 'PRODUCT_GRID.EMPTY_CATEGORY' | translate }}</ng-container>
    </button>
  </nav>

  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner></ion-spinner>
  </div>

  <!-- Virtual scroll for large catalogs (>50 products) -->
  <cdk-virtual-scroll-viewport
    *ngIf="!isLoading && products.length > 50"
    itemSize="220"
    class="virtual-scroll-viewport"
  >
    <ion-grid>
      <ion-row>
        <ion-col
          *cdkVirtualFor="let product of products"
          size="6"
          sizeMd="4"
          sizeLg="3"
        >
          <app-product-card
            [product]="product"
            (productTapped)="onProductTap($event)"
          ></app-product-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </cdk-virtual-scroll-viewport>

  <!-- Standard grid for small catalogs (≤50 products) -->
  <ion-grid
    *ngIf="!isLoading && products.length <= 50 && products.length > 0"
  >
    <ion-row>
      <ion-col *ngFor="let product of products" size="6" sizeMd="4" sizeLg="3">
        <app-product-card
          [product]="product"
          (productTapped)="onProductTap($event)"
        ></app-product-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Empty state for no products -->
  <div
    *ngIf="!isLoading && products.length === 0 && !searchQuery"
    class="empty-state"
  >
    <p>{{ 'PRODUCT_GRID.NO_PRODUCTS' | translate }}</p>
  </div>

  <!-- Empty state for no search results -->
  <div
    *ngIf="!isLoading && products.length === 0 && searchQuery"
    class="empty-state"
  >
    <ion-icon name="search-outline" size="large"></ion-icon>
    <p>{{ 'PRODUCT_GRID.NO_SEARCH_RESULTS' | translate }} "{{ searchQuery }}"</p>
    <ion-button (click)="clearSearch()">{{ 'PRODUCT_GRID.CLEAR_SEARCH' | translate }}</ion-button>
  </div>

  <!-- FAB Button for Cart (Fixed at end/bottom) -->
  <ion-fab *ngIf="itemCount() > 0" vertical="bottom" horizontal="end" slot="fixed" class="cart-fab-container">
    <ion-fab-button (click)="navigateToCart()" class="cart-fab">
      <ion-icon name="cart-outline"></ion-icon>
    </ion-fab-button>
    <ion-badge class="cart-badge" color="danger">
      {{ itemCount() }}
    </ion-badge>
  </ion-fab>
  
</ion-content>
