<ion-header>
  <ion-toolbar>
    <ion-title>{{ selectedPos?.name }}</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar 
      [(ngModel)]="searchQuery"
      (ionInput)="onSearchInput($event)"
      placeholder="Search products..."
      debounce="300">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner></ion-spinner>
  </div>

  <!-- Product grid -->
  <ion-grid *ngIf="!isLoading && products.length > 0">
    <ion-row>
      <ion-col *ngFor="let product of products" size="6" sizeMd="4" sizeLg="3">
        <app-product-card
          [product]="product"
          (click)="onProductTap(product)"
        ></app-product-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Empty state for no products -->
  <div *ngIf="!isLoading && products.length === 0 && !searchQuery" class="empty-state">
    <p>No products available</p>
  </div>

  <!-- Empty state for no search results -->
  <div *ngIf="!isLoading && products.length === 0 && searchQuery" class="empty-state">
    <ion-icon name="search-outline" size="large"></ion-icon>
    <p>No products found for "{{ searchQuery }}"</p>
    <ion-button (click)="clearSearch()">Clear Search</ion-button>
  </div>
</ion-content>
